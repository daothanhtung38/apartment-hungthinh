services:
  postgres:
    image: postgres:17
    container_name: apartment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:  apartment_db
      POSTGRES_USER: apartment_user
      POSTGRES_PASSWORD: apartment_password
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "5434:5432"

    volumes:
      - apartment_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_user -d apartment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  apartment_postgres_data:
