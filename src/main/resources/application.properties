spring.application.name=hungthinh



# APPLICATION
server.port=8080

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5434/apartment_db
spring.datasource.username=apartment_user
spring.datasource.password=apartment_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# TIMEZONE
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



# Khóa bí mật tối thiểu 256 bits (32 ký tự trở lên)
jwt.secret=your_jwt_secret_key_here_make_it_long_and_secure_at_least_256_bits
# Access token: 3600000ms = 1 giờ
jwt.expiration=3600000
# Refresh token: 86400000ms = 24 giờ
jwt.refresh-expiration=8640000